<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fafaf6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>トークダイス🎲 by MARRYELL</title>

  <!-- LIFF SDK (LINE 内ブラウザで開くため) -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Decorative background -->
  <div class="bg" aria-hidden="true">
    <div class="blob blob-coral"></div>
    <div class="blob blob-green"></div>
    <div class="blob blob-gold"></div>
    <div class="deco">
      <svg class="deco-heart d1" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>
      <svg class="deco-heart d2" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>
      <svg class="deco-heart d3" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>
      <svg class="deco-spark s1" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.6 5.6 3.4 9.2 12 12-8.6 2.8-11.4 6.4-12 12-.6-5.6-3.4-9.2-12-12C8.6 9.2 11.4 5.6 12 0Z"/></svg>
      <svg class="deco-spark s2" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.6 5.6 3.4 9.2 12 12-8.6 2.8-11.4 6.4-12 12-.6-5.6-3.4-9.2-12-12C8.6 9.2 11.4 5.6 12 0Z"/></svg>
      <svg class="deco-spark s3" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.6 5.6 3.4 9.2 12 12-8.6 2.8-11.4 6.4-12 12-.6-5.6-3.4-9.2-12-12C8.6 9.2 11.4 5.6 12 0Z"/></svg>
    </div>
  </div>

  <main class="app">

    <!-- Header -->
    <header class="hero">
      <span class="brand-badge">MARRYELL</span>
      <h1 class="title"><span class="text-gradient-coral">トークダイス</span></h1>
      <p class="lead">サイコロをふって、ふたりの話題を決めよう！</p>
    </header>

    <!-- Mode / category -->
    <section class="pop-card controls" aria-label="テーマの選び方">
      <p class="ctrl-label">いまの雰囲気は？</p>
      <div class="seg" id="level-seg">
        <button type="button" class="seg-btn" data-level="1" aria-pressed="true">
          <span class="seg-main"><span aria-hidden="true">👋</span>はじめまして</span><small>軽めのテーマ</small>
        </button>
        <button type="button" class="seg-btn" data-level="2" aria-pressed="false">
          <span class="seg-main"><span aria-hidden="true">😊</span>打ち解けてきた</span><small>少し深めのテーマ</small>
        </button>
      </div>
      <p class="ctrl-label">カテゴリ</p>
      <div class="chips" id="cat-chips"><!-- generated by app.js --></div>
    </section>

    <!-- Dice -->
    <section class="stage">
      <div class="dice-wrap" id="dice-wrap" role="button" tabindex="0" aria-label="サイコロをふる">
        <div class="dice-hop" id="dice-hop">
          <div class="dice-tilt">
            <div class="cube" id="cube"><!-- faces generated by app.js --></div>
          </div>
        </div>
        <div class="dice-shadow" id="dice-shadow"></div>
        <span class="tap-bubble" id="tap-bubble" aria-hidden="true">TAP!</span>
        <div class="burst" id="burst" aria-hidden="true"></div>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn-pop btn-coral anim-shine" id="roll-btn">
        <span aria-hidden="true">🎲</span>サイコロをふる！
      </button>
      <button type="button" class="btn-ghost" id="shake-btn" hidden>
        <span aria-hidden="true">📳</span><span id="shake-label">スマホを振ってもOKにする</span>
      </button>
    </div>

    <!-- How to (before first roll) -->
    <section class="pop-card howto" id="howto">
      <p class="howto-title">あそびかた</p>
      <ol>
        <li><span class="num">1</span>いまの雰囲気とカテゴリを選ぶ</li>
        <li><span class="num">2</span>サイコロをタップしてふる</li>
        <li><span class="num">3</span>「こう聞いてみよう」を読んで、ふたりで話そう</li>
      </ol>
      <p class="howto-note">答えにくいテーマは、気軽にパスしてOK！</p>
    </section>

    <!-- Result -->
    <section class="pop-card result" id="result" hidden aria-live="polite">
      <div class="result-head">
        <span class="cat-chip" id="r-cat"></span>
        <span class="lv-chip" id="r-level"></span>
      </div>
      <div class="r-emoji" id="r-emoji" aria-hidden="true"></div>
      <h2 class="r-title" id="r-title"></h2>
      <p class="sheet-badge" id="r-sheet" hidden>📋 プロフィールシートを見ながら話そう</p>

      <div class="bubble">
        <p class="bubble-label">💬 こう聞いてみよう</p>
        <p class="bubble-q" id="r-q"></p>
      </div>
      <div class="dig">
        <p class="dig-label">💡 深掘りのヒント</p>
        <p class="dig-q" id="r-dig"></p>
      </div>

      <div class="result-actions">
        <button type="button" class="btn-pop btn-pass" id="pass-btn">
          <span aria-hidden="true">🙆</span>パスOK！別のテーマにする
        </button>
      </div>
      <p class="pass-note">答えにくかったら遠慮なくパス。話しやすいテーマで楽しもう！</p>
    </section>

    <footer class="foot">MARRYELL 婚活バー マリエル</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="themes.js"></script>
  <script src="app.js"></script>

  <script>
    if (window.liff) {
      liff.init({ liffId: '2009657679-PqSBy6vu' })
        .then(() => { console.log('LIFF initialized'); })
        .catch((err) => { console.error('LIFF init error', err); });
    }
  </script>

</body>
</html>
